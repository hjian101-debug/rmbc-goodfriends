<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="RMBC 好朋友团契管理员后台" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>RMBC 好朋友团契管理员</title>
    <link rel="stylesheet" href="./admin.css?v=20260527-2" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-panel" data-login-panel>
        <a class="back-link" href="./index.html">返回网站</a>
        <div class="login-card">
          <p class="eyebrow">Admin</p>
          <h1>好朋友团契后台</h1>
          <p>登录后可以管理同工、聚会信息和公告。</p>
          <form data-login-form onsubmit="return rmbcAdminLogin(event)">
            <label>
              账号
              <input name="username" autocomplete="username" required />
            </label>
            <label>
              密码
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <p class="form-message" data-login-message></p>
            <button type="button" onclick="return rmbcAdminLogin(event)">登录</button>
          </form>
        </div>
      </section>

      <section class="dashboard" data-dashboard hidden>
        <aside class="sidebar">
          <a class="brand" href="./index.html">
            <span>好</span>
            <strong>RMBC GFF</strong>
          </a>
          <nav aria-label="后台导航">
            <a href="#gatherings">聚会信息</a>
            <a href="#gallery">照片管理</a>
            <a href="#team">同工管理</a>
            <a href="#announcements">公告管理</a>
          </nav>
          <button class="ghost-button" type="button" data-export-button>导出数据</button>
          <button class="ghost-button" type="button" data-reset-button>恢复默认</button>
          <button class="ghost-button" type="button" data-logout-button>退出登录</button>
        </aside>

        <div class="workspace">
          <header class="workspace-header">
            <div>
              <p class="eyebrow">Dashboard</p>
              <h1>管理员后台</h1>
            </div>
            <a class="site-link" href="./index.html">查看网站</a>
          </header>

          <p class="notice">
            当前版本会把内容保存到这个浏览器。接入数据库后，同工从任何电脑登录修改，公开网站都能同步显示。
          </p>

          <section class="admin-section" id="gatherings">
            <div class="section-bar">
              <div>
                <p class="eyebrow">Gatherings</p>
                <h2>聚会信息</h2>
              </div>
              <button type="button" data-add="gatherings">新增聚会</button>
            </div>
            <div class="editor-list" data-list="gatherings"></div>
          </section>

          <section class="admin-section" id="gallery">
            <div class="section-bar">
              <div>
                <p class="eyebrow">Photos</p>
                <h2>照片管理</h2>
              </div>
              <button type="button" data-add="gallery">新增照片</button>
            </div>
            <p class="notice">
              照片放进 assets/photos 后，照片网址填 ./assets/photos/文件名.jpg。外部照片需要使用公开图片直链。
            </p>
            <div class="editor-list" data-list="gallery"></div>
          </section>

          <section class="admin-section" id="team">
            <div class="section-bar">
              <div>
                <p class="eyebrow">Team</p>
                <h2>同工管理</h2>
              </div>
              <button type="button" data-add="team">新增同工</button>
            </div>
            <div class="editor-list" data-list="team"></div>
          </section>

          <section class="admin-section" id="announcements">
            <div class="section-bar">
              <div>
                <p class="eyebrow">News</p>
                <h2>公告管理</h2>
              </div>
              <button type="button" data-add="announcements">新增公告</button>
            </div>
            <div class="editor-list" data-list="announcements"></div>
          </section>
        </div>
      </section>
    </main>

    <script>
      function rmbcAdminLogin(event) {
        if (event) {
          event.preventDefault();
        }

        var form = document.querySelector("[data-login-form]");
        var message = document.querySelector("[data-login-message]");
        var loginPanel = document.querySelector("[data-login-panel]");
        var dashboard = document.querySelector("[data-dashboard]");
        var username = String((form && form.elements.username && form.elements.username.value) || "")
          .normalize("NFKC")
          .trim()
          .toLowerCase();
        var password = String((form && form.elements.password && form.elements.password.value) || "")
          .normalize("NFKC")
          .trim();

        if (username === "gff" && password === "gff123") {
          if (message) {
            message.textContent = "登录成功，正在打开后台...";
          }
          if (loginPanel) {
            loginPanel.hidden = true;
          }
          if (dashboard) {
            dashboard.hidden = false;
          }
          window.setTimeout(function () {
            if (typeof renderAll === "function") {
              renderAll();
            }
          }, 0);
          return false;
        }

        if (message) {
          message.textContent = "账号或密码不正确。";
        }
        return false;
      }
    </script>
    <script src="./admin.js?v=20260527-4"></script>
  </body>
</html>
