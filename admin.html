<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="RMBC 好朋友团契管理员后台" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>RMBC 好朋友团契管理员</title>
    <link rel="stylesheet" href="./admin.css?v=20260607-2" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-panel" data-login-panel>
        <a class="back-link" href="./index.html">返回网站</a>
        <div class="login-card">
          <p class="eyebrow">Admin</p>
          <h1>好朋友团契后台</h1>
          <p>登录后可以管理区块显示、聚会信息、公告和照片。</p>
          <form data-login-form>
            <label>
              账号
              <input name="username" autocomplete="username" required />
            </label>
            <label>
              密码
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <p class="form-message" data-login-message></p>
            <button type="submit">登录</button>
          </form>
        </div>
      </section>

      <section class="dashboard" data-dashboard hidden>
        <aside class="sidebar">
          <a class="brand" href="./index.html">
            <span>好</span>
            <strong>RMBC GFF</strong>
          </a>
          <nav class="admin-nav" aria-label="后台导航">
            <button type="button" data-admin-page="sections">区块显示</button>
            <button type="button" data-admin-page="gatherings">聚会信息</button>
            <button type="button" data-admin-page="studies">查经归档</button>
            <div class="admin-nav-group">
              <button type="button" data-admin-page="gallery">照片管理</button>
              <div class="admin-subnav" aria-label="照片分类">
                <button type="button" data-admin-gallery-category="fellowship">团契聚会</button>
                <button type="button" data-admin-gallery-category="activity">活动日</button>
              </div>
            </div>
            <button type="button" data-admin-page="team">同工管理</button>
            <button type="button" data-admin-page="announcements">公告管理</button>
            <a class="site-link" href="./group-admin.html">团契分组</a>
          </nav>
          <button class="ghost-button primary-action" type="button" data-save-button disabled>已保存</button>
          <button class="ghost-button" type="button" data-export-button>导出数据</button>
          <button class="ghost-button" type="button" data-refresh-button>重新读取数据库</button>
          <button class="ghost-button" type="button" data-reset-button>恢复默认</button>
          <button class="ghost-button" type="button" data-logout-button>退出登录</button>
        </aside>

        <div class="workspace">
          <header class="workspace-header">
            <div>
              <p class="eyebrow">Dashboard</p>
              <h1>管理员后台</h1>
              <p class="save-status" data-save-status>等待登录</p>
            </div>
            <a class="site-link" href="./index.html" target="_blank" rel="noopener">预览公开网站</a>
          </header>

          <section class="admin-section" id="sections" data-admin-section="sections">
            <div class="section-bar">
              <div>
                <p class="eyebrow">Visibility</p>
                <h2>区块显示</h2>
              </div>
            </div>
            <div class="editor-list" data-list="sections"></div>
          </section>

          <section class="admin-section" id="gatherings" data-admin-section="gatherings" hidden>
            <div class="section-bar">
              <div>
                <p class="eyebrow">Gatherings</p>
                <h2>聚会信息</h2>
              </div>
              <button type="button" data-add="gatherings">新增聚会</button>
            </div>
            <div class="editor-list" data-list="gatherings"></div>
          </section>

          <section class="admin-section" id="gallery" data-admin-section="gallery" hidden>
            <div class="section-bar">
              <div>
                <p class="eyebrow">Photos</p>
                <h2>照片管理</h2>
              </div>
              <button type="button" data-add="gallery">新增照片</button>
            </div>
            <div class="editor-list" data-list="gallery"></div>
          </section>

          <section class="admin-section" id="studies" data-admin-section="studies" hidden>
            <div class="section-bar">
              <div>
                <p class="eyebrow">Bible Study Archive</p>
                <h2>查经归档</h2>
              </div>
              <button type="button" data-add="studies">新增查经内容</button>
            </div>
            <div class="editor-list" data-list="studies"></div>
          </section>

          <section class="admin-section" id="team" data-admin-section="team" hidden>
            <div class="section-bar">
              <div>
                <p class="eyebrow">Team</p>
                <h2>同工管理</h2>
              </div>
              <button type="button" data-add="team">新增同工</button>
            </div>
            <div class="editor-list" data-list="team"></div>
          </section>

          <section class="admin-section" id="announcements" data-admin-section="announcements" hidden>
            <div class="section-bar">
              <div>
                <p class="eyebrow">News</p>
                <h2>公告管理</h2>
              </div>
              <button type="button" data-add="announcements">新增公告</button>
            </div>
            <div class="editor-list" data-list="announcements"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20260607-2"></script>
    <script src="./admin.js?v=20260614-1"></script>
  </body>
</html>
