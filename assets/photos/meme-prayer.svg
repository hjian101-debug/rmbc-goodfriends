<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prayer pause meme card</title>
  <desc id="desc">A calm playful illustrated card with a large pause symbol and warm light.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="0.58" stop-color="#d6a94d"/>
      <stop offset="1" stop-color="#244334"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#17211d" flood-opacity="0.25"/>
