  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="600" cy="346" r="238" fill="#fbfaf6" opacity="0.23"/>
  <g filter="url(#shadow)">
    <rect x="399" y="260" width="128" height="250" rx="64" fill="#244334"/>
    <rect x="673" y="260" width="128" height="250" rx="64" fill="#244334"/>
    <path d="M453 565c95 70 199 70 294 0" fill="none" stroke="#244334" stroke-width="30" stroke-linecap="round"/>
  </g>
  <text x="82" y="128" fill="#17211d" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">BRB</text>
  <text x="82" y="188" fill="#17211d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">praying about it</text>
