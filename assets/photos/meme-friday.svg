      <stop offset="0" stop-color="#f7d889"/>
      <stop offset="0.55" stop-color="#ec8f62"/>
      <stop offset="1" stop-color="#244334"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#17211d" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="210" fill="#fbfaf6" opacity="0.18"/>
  <circle cx="210" cy="600" r="260" fill="#fbfaf6" opacity="0.16"/>
  <g filter="url(#shadow)">
